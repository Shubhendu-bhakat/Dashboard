trigger:
  branches:
    include:
      - task/webapp-deployment

pool:
  name: 'Azure Pipelines'
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'tf-service-connection'
  resourceGroup: 'rg-hrms-dev-ind-si'
  frontendApp: 'app-frontend-inm-dev-ind-si'

stages:
  - stage: BuildAndDeployNode
    jobs:
      - job: DeployNode
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'

          - script: |
              cd $(System.DefaultWorkingDirectory)
              npm install
              zip -r node.zip *
            displayName: 'Zip Node App'

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az webapp deploy --resource-group $(resourceGroup) \
                  --name $(frontendApp) \
                  --src-path $(System.DefaultWorkingDirectory)/node.zip --type zip
            displayName: 'Deploy Node App'